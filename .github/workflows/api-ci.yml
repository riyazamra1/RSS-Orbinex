name: API CI

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check API
        run: npm run typecheck
      - name: Build API
        run: npm run build
      - name: Run API tests
        run: npm test
